<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Rose Day De-Tan</title>
<style>
body{ margin:0; overflow:hidden; background:black; font-family:Segoe UI, sans-serif; }
#ui{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    pointer-events:none;
}
#ui h1{
    font-size:2.4rem;
    text-shadow:0 0 25px hotpink;
}
#signature{
    margin-top:15px;
    opacity:0;
    font-style:italic;
    color:#ff9dbb;
    animation:fade 3s ease forwards;
    animation-delay:5s;
}
@keyframes fade{to{opacity:1}}
</style>
</head>

<body>
<div id="ui">
    <h1>🌹 Happy Rose Day, De-Tan ❤️</h1>
    <div id="signature">— from your dear Vzbdbqvkx</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/geometries/TextGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/FontLoader.js"></script>

<script>
/* SCENE */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.z=30;

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

/* LIGHTS */
scene.add(new THREE.AmbientLight(0xff88aa,1.2));
const light=new THREE.PointLight(0xff77aa,2,100);
light.position.set(20,20,20);
scene.add(light);

/* STARS */
const starGeo=new THREE.BufferGeometry();
const starCount=1500;
const starPos=[];
for(let i=0;i<starCount;i++){
    starPos.push((Math.random()-0.5)*600,(Math.random()-0.5)*600,(Math.random()-0.5)*600);
}
starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:1})));

/* 3D ROSE */
const roseGroup=new THREE.Group();
scene.add(roseGroup);

const petalMat=new THREE.MeshStandardMaterial({
    color:0xff2d55,
    emissive:0x660018,
    roughness:0.4
});

for(let i=0;i<20;i++){
    const geo=new THREE.ConeGeometry(1.5,4,12);
    const petal=new THREE.Mesh(geo,petalMat);
    petal.position.y=Math.random()*2;
    petal.rotation.z=Math.random()*Math.PI;
    petal.rotation.y=(Math.PI*2/20)*i;
    petal.scale.set(0.01,0.01,0.01);
    roseGroup.add(petal);
}

const stem=new THREE.Mesh(
    new THREE.CylinderGeometry(0.2,0.25,8),
    new THREE.MeshStandardMaterial({color:0x1f7a1f})
);
stem.position.y=-6;
roseGroup.add(stem);

/* FAST BLOOM */
let bloom=true;

/* SPARKLES */
function sparkles(){
    const g=new THREE.BufferGeometry();
    const pts=[];
    for(let i=0;i<150;i++){
        pts.push(
            roseGroup.position.x+(Math.random()-0.5)*4,
            roseGroup.position.y+(Math.random()-0.5)*4,
            roseGroup.position.z+(Math.random()-0.5)*4
        );
    }
    g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
    const p=new THREE.Points(g,new THREE.PointsMaterial({color:0xffb6c1,size:0.25}));
    scene.add(p);
    setTimeout(()=>scene.remove(p),1000);
}

window.addEventListener("click",sparkles);

/* 3D NAME */
const loader=new THREE.FontLoader();
loader.load("https://threejs.org/examples/fonts/helvetiker_bold.typeface.json",font=>{
    const textGeo=new THREE.TextGeometry("De-Tan",{
        font:font,
        size:2.5,
        height:0.5
    });
    const textMat=new THREE.MeshStandardMaterial({
        color:0xff9dbb,
        emissive:0x440016
    });
    const text=new THREE.Mesh(textGeo,textMat);
    text.position.set(-5,6,0);
    scene.add(text);

    /* Text animation */
    function textAnim(){
        text.rotation.y+=0.01;
        text.position.y=6+Math.sin(Date.now()*0.002);
    }
    animateText=textAnim;
});

let animateText=()=>{};

/* ANIMATE */
function animate(){
    requestAnimationFrame(animate);

    roseGroup.rotation.y+=0.01;

    if(bloom){
        roseGroup.children.forEach(p=>{
            if(p.scale.x<1){
                p.scale.multiplyScalar(1.05); // FAST BLOOM
            }
        });
        bloom=false;
    }

    animateText();
    controls.update();
    renderer.render(scene,camera);
}
animate();

window.onresize=()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
};
</script>
</body>
</html>
